name: Build Rissu Kernel A10s
on:
  workflow_dispatch:
jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull Clang
        run: |
          mkdir -p clang
          wget --tries=5 --timeout=60 --waitretry=10 --retry-connrefused -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/bd96dfe349c962681f0e5388af874c771ef96670/clang-r416183b.tar.gz -O clang.tar.gz
          tar -C clang/ -xzf clang.tar.gz
      - name: Pull GCC
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
      - name: Pull kernel source
        run: |
          git clone --depth=1 https://github.com/samsung-mt6765-devs/android_kernel_samsung_a10s kernel-source
      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
          cd kernel-source
          make O=out ARCH=arm64 CC=$GITHUB_WORKSPACE/clang/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android- CONFIG_LTO_NONE=y yukiprjkt_defconfig
          make -j2 O=out ARCH=arm64 CC=$GITHUB_WORKSPACE/clang/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$GITHUB_WORKSPACE/gcc/bin/aarch64-linux-android- CONFIG_LTO_NONE=y
      - name: Package kernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: output_kernel
          path: AnyKernel3/*
